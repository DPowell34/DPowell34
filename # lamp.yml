# lamp.yml
---
- name: Install LAMP stack on Rocky Linux
  hosts: rocky9
  become: true

  tasks:
  - name: Install Apache, MariaDB, PHP, and PHP MySQL module
    dnf: 
      name:
        - httpd
        - mariadb-server
        - php
        - php-mysqlnd
      state: present

      - name: Start and enable Apache  
      service:
        name: httpd
        state: started
        enabled: true
  
  - name: Start and enable MariaDB
      service:
        name: mariadb
        state: started
        enabled: true

  - name: Start and enable firewalld
      service:
        name: firewalld
        state: stopped
        enabled: false

  - name: Create a PHP test page
      copy:
        dest: /var/www/html/info.php
        content: "<?php phpinfo(); ?>"
        owner: apache
        group: apache
        mode: '0644'
        